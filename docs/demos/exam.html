<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS101 Midterm Exam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 2rem; }
    .exam-container { max-width: 800px; margin: 0 auto; }
    .header { background: #1a1a2e; color: white; padding: 1.5rem; border-radius: 8px 8px 0 0; }
    .header h1 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .header p { opacity: 0.8; font-size: 0.9rem; }
    .question { background: white; padding: 2rem; border-radius: 0 0 8px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .question h2 { color: #333; margin-bottom: 1rem; font-size: 1.1rem; }
    .question .points { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; }
    textarea { width: 100%; min-height: 250px; padding: 1rem; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 16px; line-height: 1.6; resize: vertical; font-family: inherit; }
    textarea:focus { border-color: #4a90d9; outline: none; box-shadow: 0 0 0 3px rgba(74,144,217,0.15); }
    .word-count { text-align: right; color: #666; font-size: 0.85rem; margin-top: 0.5rem; }
    .submit-area { margin-top: 1.5rem; text-align: right; }
    .submit-btn { background: #4a90d9; color: white; border: none; padding: 0.75rem 2rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .submit-btn:hover { background: #3a7bc8; }
  </style>
</head>
<body>
  <!--
    SEB Monitor — production integration.
    This is exactly how Moodle would inject the monitoring script:
    1. Load the bundled seb-monitor.js
    2. Configure via data-* attributes on the script tag
    3. The library auto-initializes and starts monitoring
  -->
  <script src="http://localhost:8000/seb-monitor.js"
    data-student-id="Dimitri"
    data-module-id="CS101"
    data-exam-id="https://moodle.example.com/exam/123"
    data-server-url="http://localhost:8000"
    data-question-id="q1">
  </script>

  <div class="exam-container">
    <div class="header">
      <h1>CS101 — Introduction to Computer Science</h1>
      <p>Midterm Exam • Question 1 of 3</p>
    </div>

    <div class="question">
      <h2>Question 1: Explain the concept of recursion in computer science.</h2>
      <p class="points">[10 points]</p>

      <textarea id="answer-q1"
        placeholder="Write your answer here. Your work is automatically saved and monitored for academic integrity purposes."></textarea>
      <div class="word-count">Words: <span id="word-count">0</span></div>

      <div class="submit-area">
        <button class="submit-btn" onclick="alert('Answer submitted! (demo)')">Submit Answer</button>
      </div>
    </div>
  </div>

  <script>
    // Simple word counter
    const textarea = document.getElementById('answer-q1');
    const counter = document.getElementById('word-count');
    textarea.addEventListener('input', () => {
      const words = textarea.value.trim().split(/\s+/).filter(w => w.length > 0);
      counter.textContent = words.length;
    });
  </script>
</body>
</html>
